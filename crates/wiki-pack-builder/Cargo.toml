[package]
name = "wiki-pack-builder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
wiki-model = { path = "../wiki-model" }
wiki-core = { path = "../wiki-core" }
wiki-source = { path = "../wiki-source" }
wiki-store = { path = "../wiki-store" }
wiki-search = { path = "../wiki-search" }
wiki-pack-format = { path = "../wiki-pack-format" }
html5ever = "0.40"
url = "2"
sha2 = "0.10"
# PACK-003 lossless re-encoding (publisher side only; pure Rust codecs).
# Pinned: later 0.25 releases need Rust 1.88, above the workspace toolchain.
image = { version = "=0.25.6", default-features = false, features = ["png", "gif", "webp"] }

[dev-dependencies]
bzip2 = "0.6.1"
crc32fast = "1"
sha1 = "0.10"
