[package]
name = "wiki-source"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
wiki-model = { path = "../wiki-model" }
wiki-core = { path = "../wiki-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
# MD5 only names where Wikimedia stores a media file (MOBPACK-003); no security use.
md-5 = "0.10"
# Wikimedia states SHA-1 for original files; checked before packing (PACK-003).
sha1 = "0.10"
# Default bzip2 backend is portable Rust libbz2-rs-sys, not a C toolchain.
bzip2 = "0.6.1"
ammonia = "4.1"
# Already in the tree through ammonia; its tokenizer reads rendered article HTML.
html5ever = "0.40"
# The root Cargo.lock keeps url 2.4.1 for Rust 1.85.1, while the separate
# Tauri workspace requires url ^2.5 through Wry. Keep this compatible with both.
url = "2"
