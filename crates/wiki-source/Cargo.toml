[package]
name = "wiki-source"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
wiki-model = { path = "../wiki-model" }
wiki-core = { path = "../wiki-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
