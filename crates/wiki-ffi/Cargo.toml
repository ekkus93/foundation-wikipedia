[package]
name = "wiki-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# rlib keeps workspace tests and Rust consumers usable; cdylib is the Android ABI artifact.
crate-type = ["rlib", "cdylib"]

# MOB-001 owner decision (2026-11-13): this crate alone relaxes the workspace
# `unsafe_code = "forbid"` to "deny", so UniFFI-generated FFI scaffolding can
# be allowed in the single `android` export module. Hand-written `unsafe` is
# still rejected (see scripts/test_ffi_unsafe_boundary.py).
[lints.rust]
unsafe_code = "deny"

[dependencies]
wiki-model = { path = "../wiki-model" }
wiki-core = { path = "../wiki-core" }
wiki-store = { path = "../wiki-store" }
wiki-source = { path = "../wiki-source" }
wiki-search = { path = "../wiki-search" }
wiki-ai = { path = "../wiki-ai" }
wiki-pack-format = { path = "../wiki-pack-format" }
uniffi = { version = "0.31", default-features = false }

# AI-003/MOB-001: one-time initialisation of the Android OS certificate
# verifier. The JNI export is generated by `jni::native_method!` (no
# hand-written unsafe); versions must match those of rustls-platform-verifier.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
rustls-platform-verifier = "0.7.1"
