[package]
name = "wiki-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# rlib keeps workspace tests and Rust consumers usable; cdylib is the Android ABI artifact.
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true

[dependencies]
wiki-model = { path = "../wiki-model" }
wiki-core = { path = "../wiki-core" }
wiki-store = { path = "../wiki-store" }
wiki-search = { path = "../wiki-search" }
wiki-ai = { path = "../wiki-ai" }
wiki-pack-format = { path = "../wiki-pack-format" }
