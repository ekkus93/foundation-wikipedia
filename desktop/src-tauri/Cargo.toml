[package]
name = "foundation-wikipedia-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
build = "build.rs"

[lib]
name = "foundation_wikipedia_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = "2.4.1"

[dependencies]
tauri = "2.8.5"
wiki-core = { path = "../../crates/wiki-core" }
wiki-source = { path = "../../crates/wiki-source" }
wiki-store = { path = "../../crates/wiki-store" }
wiki-model = { path = "../../crates/wiki-model" }
wiki-ai = { path = "../../crates/wiki-ai" }
# DUI-001: the shared offline library (verified install, offline reading).
wiki-ffi = { path = "../../crates/wiki-ffi" }
# Native file picker for importing packs (called from Rust only).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DUI-001: hand a user-confirmed web link to the system browser.
open = "5"
# OS secret storage for hosted AI keys (macOS Keychain, Windows Credential
# Manager, Linux Secret Service). Without these features keyring silently
# uses an in-memory mock store.
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Separate from the platform-neutral root workspace.
[workspace]
