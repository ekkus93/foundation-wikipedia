[package]
name = "foundation-wikipedia-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
build = "build.rs"

[lib]
name = "foundation_wikipedia_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = "2.4.1"

[dependencies]
tauri = "2.8.5"
wiki-core = { path = "../../crates/wiki-core" }
wiki-source = { path = "../../crates/wiki-source" }
wiki-store = { path = "../../crates/wiki-store" }
wiki-model = { path = "../../crates/wiki-model" }

# Separate from the platform-neutral root workspace.
[workspace]
