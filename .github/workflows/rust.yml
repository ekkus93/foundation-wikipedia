name: Rust workspace
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.1"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee rust-test.log
      - name: Verify fixture provenance
        run: python3 scripts/verify_fixture_provenance.py
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-evidence
          path: rust-test.log
          retention-days: 14
          if-no-files-found: warn
      - name: Confirm exact head
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Validated %s\n' "$GITHUB_SHA"
