name: Android FFI bridge
on:
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'tools/uniffi-bindgen/**'
      - 'android/**'
      - 'fixtures/synthetic/wpack/**'
      - 'Cargo.lock'
      - '.github/workflows/android-ffi-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ffi-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and Android x86_64 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.1'
          targets: x86_64-linux-android
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK and pinned NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" 'ndk;27.2.12479018'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Committed Kotlin bindings match the Rust exports
        run: |
          bash android/scripts/generate-uniffi-kotlin.sh
          git diff --exit-code -- android/app/src/main/java/uniffi
      - name: Build wiki-ffi for the x86_64 emulator
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" RUST_ANDROID_ABIS=x86_64 \
            bash android/scripts/build-rust-android.sh
          test -f android/app/src/main/jniLibs/x86_64/libwiki_ffi.so
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build app and instrumented test APKs
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable KVM hardware acceleration for the emulator
        # Best effort: some hosted runners expose no /dev/kvm, in which case
        # the emulator still runs (slowly) under software emulation.
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::warning::/dev/kvm is not present on this runner; using software emulation"
            exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ -w /dev/kvm ]; then
            echo "KVM acceleration enabled"
          else
            echo "::warning::/dev/kvm is not writable after udev reload; using software emulation"
          fi
      - name: Run Rust bridge instrumented tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r org.foundation.wikipedia.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/android-ffi-bridge.log
            grep -F 'OK (2 tests)' /tmp/android-ffi-bridge.log
      - name: Preserve instrumented test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ffi-bridge-evidence
          path: /tmp/android-ffi-bridge.log
          retention-days: 14
          if-no-files-found: warn
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
