name: Platform shells
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Typecheck and bundle
        working-directory: desktop
        run: npm run build
      - name: Confirm head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

  android-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK and unit tests
        working-directory: android
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Confirm head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
