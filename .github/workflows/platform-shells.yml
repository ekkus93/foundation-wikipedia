name: Platform shells
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Source lint (unused locals and parameters)
        working-directory: desktop
        run: npm run lint
      - name: Audit npm dependency licenses
        working-directory: desktop
        run: npm run audit:licenses
      - name: Typecheck and bundle
        working-directory: desktop
        run: npm run build
      - name: Confirm head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

  android-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK and unit tests
        working-directory: android
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Preserve Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foundation-wikipedia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Confirm head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

  desktop-tauri:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - name: Check native Tauri adapter
        run: cargo +1.90.0 check --manifest-path desktop/src-tauri/Cargo.toml
      - name: Confirm head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
