name: Android install smoke
on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-install-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Install APK and launch on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # reactivecircus executes this payload with POSIX /bin/sh on Linux.
            set -eu
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            test -f "$APK"
            adb install -r "$APK"
            adb shell am force-stop org.foundation.wikipedia
            adb shell am start -W -n org.foundation.wikipedia/.MainActivity | tee /tmp/foundation-launch.txt
            adb shell pidof org.foundation.wikipedia | grep -Eq '^[0-9]+'
            adb shell dumpsys activity activities | grep -F 'org.foundation.wikipedia/.MainActivity'
      - name: Preserve install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-install-smoke-evidence
          path: |
            /tmp/foundation-launch.txt
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: warn
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
